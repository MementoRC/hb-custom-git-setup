[workspace]
name = "custom-git-setup"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks.rebuild]
cmd = "bash scripts/pixi-launch.sh rebuild"
description = "Run hummingbot-branch-tracking.sh --rebuild in the hummingbot repo (log: /tmp/rebuild.log)"

[tasks.drift-check]
cmd = "bash scripts/pixi-launch.sh drift-check"
description = "git fetch origin, then run check_ci_base_drift.sh in the hummingbot ci env"

[tasks.bt-test]
cmd = "bash scripts/pixi-launch.sh bt-test"
description = "Run scripts/tests/<name>.sh in the hummingbot ci env (pass <name> as the argument)"

[tasks.dry-run]
cmd = "bash scripts/pixi-launch.sh dry-run"
description = "Run scripts/tests/dry_run_incremental_ci_base.sh in the hummingbot ci env"

[tasks.cron-now]
cmd = "bash scripts/cron-now.sh"
description = "Run hummingbot-cron-wrapper.sh detached in its own systemd user unit (escapes the caller's cgroup); refuses if the pipeline lock is held"

[tasks.rebuild-now]
cmd = "bash scripts/cron-now.sh --rebuild"
description = "Like cron-now, but passes --rebuild to the wrapper"

[tasks.connector-exec]
cmd = "/home/memento/PycharmProjects/Hummingbot/hummingbot/.pixi/envs/default/bin/python -I -B scripts/connector_env_exec.py"
description = "Prompt for the Hummingbot password, decrypt one connector's secrets, exec a command with them in env: connector-exec kraken -- <cmd> [args]"

[tasks.connector-exec-test]
cmd = "/home/memento/PycharmProjects/Hummingbot/hummingbot/.pixi/envs/default/bin/python -I -B -m pytest -p no:cacheprovider scripts/tests/test_connector_env_exec.py"
description = "Run connector_env_exec unit tests with the hummingbot env interpreter"

[tasks.connector-exec-lint]
cmd = "/home/memento/PycharmProjects/Hummingbot/hummingbot/.pixi/envs/default/bin/python -I -B -m ruff check --no-cache --isolated --select S scripts/connector_env_exec.py"
description = "ruff flake8-bandit (S) check of connector_env_exec.py"

[feature.cockpit.dependencies]
python = "3.12.*"
streamlit = "*"

[feature.cockpit.tasks]
cockpit = "streamlit run cockpit/app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true --browser.gatherUsageStats false --client.toolbarMode viewer"
cockpit-check = "python -m py_compile cockpit/app.py cockpit/ghdata.py cockpit/logdata.py cockpit/needs_user.py && python cockpit/logdata.py"
needs-user = "python cockpit/needs_user.py"

[environments]
cockpit = ["cockpit"]
