# branch-tracking.yaml
# --------------------
# Declares which branches should be merged into target branches.
# Used by hummingbot-branch-tracking.sh and hummingbot-rebase-check.sh.
#
# Fields:
#   enabled:                    Whether to include in sync cycles
#   permanent:                  Never auto-disable (always track)
#   disable_when_in_development: Auto-skip if branch is already merged into development
#   feature_only:               Only merge feature content (no test/doc changes)
#   interface_monitor:          Run interface compatibility checks after merging
#   parent:                     Parent branch for chained branches (default: development)
#                               Chained branches are merged AFTER their parent in topological order.
#   tier:                       Merge tier — controls ordering within a rebuild cycle:
#                                 infrastructure  Whole-project migrations (ruff format, pixi, pytest).
#                                                 Merged FIRST; become the base that feature branches
#                                                 build on. Any branch touching project-wide tooling
#                                                 or CI belongs here.
#                                 feature         Specific functionality additions that build on top
#                                                 of the infrastructure layer. Merged AFTER all
#                                                 infrastructure branches are applied.
#
# Last reviewed: 2026-04-17

target_branches:
  ci-base:
    # _for_ci/* branches: ci-base-layer fixes merged AFTER the development
    # sync + format pass, BEFORE bleeding-edge rebuilds from ci-base.
    # Same logical-conflict abort gates as _for_bleed (pyproject.toml,
    # conftest.py, .github/, .pre-commit-config.yaml).
    tracked_branches:
      - name: _for_ci/fix-pytest-asyncio-call-sync-deadlock
        enabled: true
        tier: bugfix
        parent: null
        description: "Threadsafe call_sync fix — pytest-asyncio cross-thread deadlock exposed by asyncio_mode=auto"
        permanent: false
        disable_when_in_development: true

      - name: _for_ci/fix-singleton-pollution-in-command-tests
        enabled: false
        # TODO: re-enable once the _for_ci/fix-singleton-pollution-in-command-tests branch is pushed to origin
        tier: bugfix
        parent: null
        description: "Resets singletons in command/ tests via autouse fixture"
        permanent: false
        disable_when_in_development: true

  bleeding-edge:
    # Base branch: formatted superset of development.
    # Merged INTO bleeding-edge as the starting point (not a tracked branch).
    # Synced with development + pixi run format + _for_ci/* merges before each rebuild.
    base_branch: ci-base

    tracked_branches:
      # --- CI / infrastructure ---

      # _for_bleed/ci-and-testing: PROMOTED to ci-base (2026-04-18)
      # ci-base is the formatted base layer, not a merge ingredient.
      # It is synced with development and used as bleeding-edge's starting point.

      - name: _for_bleed/py312-runtime
        enabled: true
        tier: infrastructure
        description: "Python 3.12 runtime: stdlib shims, dependency pins, Cython directives — fixes pyupgrade/refactor cannot produce"
        permanent: true
        disable_when_in_development: false

      - name: _for_bleed/test-coverage
        enabled: true
        tier: infrastructure
        description: "Low-hanging-fruit test coverage for uncovered lines in diff vs development"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/environment
        enabled: true
        tier: feature
        description: "Environment and dependency fixes (injective-py, pip_packages)"
        permanent: false
        disable_when_in_development: true

      # --- Bleeding-edge-only patches ---

      - name: _for_bleed/add-executor-lock-unlock-collateral
