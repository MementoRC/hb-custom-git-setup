    # Listed below in tier order (infrastructure first, feature second).
    # See infrastructure-tier branches here before feature-tier branches below.
    # Base branch: modular (passthrough superset of ci-base, itself a superset of development).
    # Merged INTO bleeding-edge as the starting point (not a tracked branch).
    # modular is fast-forwarded to ci-base tip before each bleeding-edge rebuild.
    base_branch: modular

    tracked_branches:
      # --- CI / infrastructure ---

      # _for_bleed/ci-and-testing: PROMOTED to ci-base (2026-04-18)
      # ci-base is the formatted base layer, not a merge ingredient.
      # It is synced with development and used as bleeding-edge's starting point.

