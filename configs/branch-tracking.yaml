    # Compiled-extension optimization layer above bleeding-edge (Rust, Cython).
    # Keeps bleeding-edge purely pure-Python; accelerated is where compiled-extension
    # work lands. Built the same way bleeding-edge is built from modular: fresh branch
    # checked out from the parent tier's tip, tracked_branches merged on top, quality
    # gate (plus compile-gate steps unique to this tier) run, then pushed.
    # Base branch: bleeding-edge.
    base_branch: bleeding-edge

    tracked_branches:
      # NOTE: both entries below are enabled: false — the branches do not exist yet
      # (follow-up work, not yet authored). Tracked-branch entries pointing at
      # non-existent refs cause daily "Branch does not exist" cron log spam (see
      # documented incidents on _for_ci/* retirements above). Flip to enabled: true
      # once the corresponding branch actually exists.

      - name: _for_accel/rust-accelerators
        enabled: true   # Flipped 2026-07-09: branch created and pushed to origin, contains same content as former _for_bleed/rust-integration
        tier: feature
        description: "In-tree hummingbot/rust/ crate + fallback wrappers, relocated/rebased from _for_bleed/rust-integration"
