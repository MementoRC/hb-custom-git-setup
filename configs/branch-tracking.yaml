        permanent: false
        disable_when_in_development: false

  modular:
    # Passthrough layer between ci-base and bleeding-edge.
    # During each rebuild the script fast-forwards modular to the ci-base tip, then pushes.
    # Any merge conflict during fast-forward is treated as a hard abort (should never occur
    # because modular tracks ci-base exactly).
    # tracked_branches here carry sub-package wiring that must land on modular BEFORE
    # bleeding-edge features are merged.
    base_branch: ci-base

    tracked_branches:
      # Latent architectural facts from the 2026-07-13 sub-package integration survey
      # (subpackage-bleeding-edge-integration-survey.md) — not yet encoded as tracked-branch
      # metadata below, but future branch authors must account for them:
      #
      # 1. market-connector and market-data both have a REAL (currently undeclared) internal
      #    dependency on strategy-framework. Any FUTURE _for_bleed/* branch where either of
      #    these two sub-packages actually imports/consumes strategy-framework MUST declare
      #    `base: modular` (NOT `base: ci-base` — that mistake was already made once by an
      #    unrelated branch and had to be verified/refuted after the fact).
      #
      # 2. Gitlink-sequencing constraint: if modular-wiring (or any future wiring branch) is
      #    ever split into per-package commits, the strategy-framework submodule pointer must
      #    be bumped in the same commit as, or an earlier commit than, market-connector's or
      #    market-data's pointer bump — the latter two depend on it. Currently a non-issue
      #    because all 14 pins move together in one commit; this is a forward-looking guard
      #    for if that ever changes.
      #
      # 3. data-type-primitives and connector-utils share a "frozen-mirror" relationship:
      #    data-type-primitives's _trading_pair.py intentionally duplicates connector-utils's
      #    trading-pair split/combine logic (labeled/documented, not accidental). This is NOT
      #    a merge dependency (neither package has an active consuming branch) — noted here so
      #    a future extraction effort declares a real dependency rather than re-vendoring the
      #    logic again.
      - name: _for_bleed/modular-wiring
        enabled: true
        base: modular
        tier: infrastructure
        merge_order: 1
        description: "Sub-package wiring layer: .gitmodules + 14 gitlinks, install-subpackages + compat tasks, ci/check_subpackage_compat.py, web_assistant/async_utils shims, sub-packages-compat CI job, remote_iface Phase-6 cutover (ce0721754)"
        permanent: false
        disable_when_in_development: false

      - name: _for_bleed/dedupe-hummingbot-logger-modular
        enabled: true
        base: modular
        tier: feature
        merge_order: 2
        description: "Re-tiered replacement for the ci-base-tier _for_bleed/dedupe-hummingbot-logger (that entry is structurally unfixable at ci-base — no sub-packages/ wiring there). Replaces hummingbot/logger/logger.py's duplicate HummingbotLogger with a real `from logger.logger import HummingbotLogger` re-export (fixes MementoRC/hb-logger#9), and wires the hb-logger callback API (register_notify_handler / register_network_handler) into HummingbotApplication.__init__ — the first real call site for MementoRC/hb-logger#1's Phase 0 callback-registration refactor, replacing the old HummingbotApplication.main_application() singleton lookup baked into modular's pre-refactor logger.py. Depends on the logger submodule provided by modular-wiring; merge_order 2 (after modular-wiring's 1)."
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/user-stream-tracker
        enabled: true
        base: modular
        tier: feature
        merge_order: 3
        description: "Parent-side wiring for the hb-user-stream-tracker extraction (hb-user-stream-tracker#1, merged to development 2026-08-04). Adds the sub-packages/user-stream-tracker submodule (15th), install-subpackages + ci/check_subpackage_compat.py entries, and rewrites hummingbot/core/data_type/user_stream_tracker.py and user_stream_tracker_data_source.py as 3-line re-export shims (Recipe 1). Verified before replacing: each source file held only its single target class, and all 102 imports across 100 files reference only UserStreamTracker / UserStreamTrackerDataSource, so the 46 connector user-stream data source files need zero import changes. Based on modular (NOT ci-base) because install-subpackages and check_subpackage_compat.py exist only from the modular tier upward -- follows the dedupe-hummingbot-logger-modular precedent. NOTE: also edits .importlinter, which _for_ci/import-linter otherwise owns; the two touch different regions (this adds a root_packages entry plus a new top layer row; that branch adds ignore_imports inside two contract bodies)."
        permanent: false
        disable_when_in_development: true
        last_reviewed: "2026-08-05"

      - name: _for_bleed/exceptions-shim
        enabled: true
        base: modular
        tier: feature
        merge_order: 4
        description: "Replace hummingbot/exceptions.py with a re-export shim from data-type-primitives (hb-data-type-primitives#10, commit 523118e1). Phase 1 Step 1 of the post-ADR-0001 extraction plan. RE-TIERED 2026-08-05 from bleeding-edge.tracked_branches to modular: the bleeding-edge gate runs the full pytest suite BEFORE install-subpackages, so the shim import of data_type_primitives failed collection (exit=2) and the merge was reverted every run -- structurally unfixable at that tier, same reason dedupe-hummingbot-logger was re-tiered to dedupe-hummingbot-logger-modular. Branch is at 29cba381 (rebased --onto ci-base 2026-08-04 to shed an unintended logger.py change); merge_tree verified clean against modular, so no further rebase is needed for this move."
        permanent: false
        disable_when_in_development: true
        last_reviewed: "2026-08-05"

      - name: _for_bleed/common-data-types-shim
        enabled: true
        base: modular
        tier: feature
        merge_order: 5
        description: "Rewrite hummingbot/core/data_type/common.py as an explicit re-export of its 11 public names (OrderType, TradeType, PositionAction, PositionSide, PositionMode, PriceType, LPType, OpenOrder, GroupedSetDict, MarketDict, LazyDict) from the data-type-primitives sub-package. Phase 1 definition-site fix of the post-ADR-0001 extraction plan; commit 71366e9b, GPG-verified. Attacks the DEFINITION SITE rather than the ~387 importing files: the parent and sub-package copies had already converged member-for-member, so no value migration remained -- only a duplicate-class-object problem. Enum equality is identity-based, and TradeFeeBase branches on TradeType/PositionAction equality to pick a fee class, so the duplicate surfaced as a WRONG FEE with no exception. Re-export collapses this to one class object per type; every importing file keeps its import path unchanged. Explicit named imports (not a star import) so the sub-package's extra LimitOrderStatus does not silently widen the parent's public API. Based on modular (NOT ci-base) for the same reason as user-stream-tracker and exceptions-shim: ci-base carries no sub-packages/, no .gitmodules and no install-subpackages, so the import cannot resolve there -- and registering on bleeding-edge.tracked_branches would fail collection (exit=2) every run because that gate runs pytest BEFORE install-subpackages. Verified in-worktree: all 11 names assert identity against data_type_primitives; LazyDict PEP695 __parameters__ (KT, VT) intact; test_trade_fee.py + test_trade_fee_schema_loader.py + test_in_flight_order.py + test_limit_order.py = 43 passed 0 failed; test/hummingbot/core/data_type/ = 111 passed 29 skipped 0 failed; format and lint clean. Known change: OrderType.__module__ becomes data_type_primitives.common (internal isinstance stays valid, one class object; external qualname matchers would need updating -- exceptions.py already took this shift). Unblocks hb-trade-fee and hb-connector-data-types. DISABLED 2026-08-10: conflicts with _for_bleed/add-new-order-types (a6b1dad4e7 'feat(core): conditional OrderType enum + DelayedMarketOrder'), which adds OrderType members 7-12 and the is_delayed_market_type/is_conditional_type helpers to this same file. This shim deletes the enum body they extend, so the --rebuild hit 'Merge conflict - trying format-aware merge' and the auto-resolution produced a file with this docstring, their restored class bodies, and NO module imports at all - Quality gate FAILED on bleeding-edge, run 20260810_143855, and the pre-push gate correctly refused to push bleeding-edge/accelerated. ci-base and modular gated green and DID push, so the shim remains live and correct on modular. Durable fix pending: data_type_primitives already carries members 7-12 and all three helpers, so add-new-order-types' common.py hunk is redundant once this lands - drop that hunk (keeping its test_order_type_extensions.py) after auditing its two declared children kraken-new-order-types and position-exchange-executor for their own common.py edits. A parent: declaration alone does NOT fix this: both branches edit the same region incompatibly, so sequencing only changes which order the conflict occurs in. RE-ENABLED 2026-08-10 after fixing the conflict at its source: _for_bleed/add-new-order-types commit 695f5787 drops its now-redundant common.py hunk (keeping test_order_type_extensions.py), because data_type_primitives already carries members 7-12, the five-variant is_limit_type, and both is_delayed_market_type and is_conditional_type - verified character-for-character before removal. Note that disabling this entry was INEFFECTIVE as a mitigation and the second rebuild failed identically: modular accumulates merged content permanently and bleeding-edge is re-cut from the modular tip, so commit 71366e9b stayed in every build regardless of this flag. Merge sequence verified in a scratch worktree cut from origin/modular: merging the reworked add-new-order-types contributes only the 86-line test file with zero common.py change, after which kraken-new-order-types and position-exchange-executor BOTH merge clean. Pairwise merge-tree against a bare modular still shows those two conflicting, which is expected and misleading - they inherit the hunk and are only resolved by their parent landing first, guaranteed here by the parent chain add-new-order-types then kraken-new-order-types then position-exchange-executor."
        permanent: false
        disable_when_in_development: true
        last_reviewed: "2026-08-10"

