# branch-tracking.yaml
# --------------------
# Declares which branches should be merged into target branches.
# Used by hummingbot-branch-tracking.sh and hummingbot-rebase-check.sh.
#
# Fields:
#   enabled:                    Whether to include in sync cycles
#   permanent:                  Never auto-disable (always track)
#   disable_when_in_development: Auto-skip if branch is already merged into development
#   feature_only:               Only merge feature content (no test/doc changes)
#   interface_monitor:          Run interface compatibility checks after merging
#
# Last reviewed: 2026-03-25

target_branches:
  bleeding-edge:
    tracked_branches:
      # --- CI / infrastructure (applied first, order matters) ---

      - name: _for_bleed/pixi-ci-migration
        enabled: true
        description: "CI conda→pixi migration: workflow.yml, .pre-commit-config.yaml (ruff), pytest-timeout, vertex ignore"
        permanent: true
        disable_when_in_development: false

      - name: _for_bleed/environment
        enabled: true
        description: "Environment and dependency fixes (injective-py, pip_packages)"
        permanent: false
        disable_when_in_development: true

      # --- Feature branches (custom additions to bleeding-edge) ---

      - name: feat/add-new-order-types
        enabled: false  # CONFLICT: needs rebase onto current development
        description: "Core support for new order types"
        permanent: false
        disable_when_in_development: true

      - name: feat/add-executor-factory
        enabled: false  # CONFLICT: needs rebase onto current development
        description: "Use a factory for orchestrator"
        permanent: false
        disable_when_in_development: true

      - name: feat/kraken-new-order-types
        enabled: false  # CONFLICT: needs rebase onto current development
        description: "Kraken new order types implementation"
        permanent: false
        disable_when_in_development: true

      - name: feat/position-exchange-executor
        enabled: false  # DEPENDS on feat/add-new-order-types (STOP_LOSS OrderType)
        description: "Position-based exchange executor"
        permanent: false
        disable_when_in_development: true

      - name: feat/coinbase_advanced_trade_candles
        enabled: false  # CONFLICT: needs rebase onto current development
        description: "Candles for Coinbase Advanced Trade"
        permanent: false
        disable_when_in_development: true

      - name: feat/conda-environment-upgrade
        enabled: false  # SUPERSEDED by _for_bleed/pixi-ci-migration
        description: "Conda environment and dependency upgrades"
        permanent: false
        disable_when_in_development: true

      # --- Bleeding-edge-only patches ---

      - name: _for_bleed/add-executor-lock-unlock-collateral
        enabled: true
        description: "Lock/Unlock collateral for executor"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/candles-public-api
        enabled: true
        description: "Public API for CandlesBase + hb-candles-feed package integration with native fallback"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/progressive-executor-trading-v2
        enabled: true
        description: "ProgressiveExecutor feature v2 - depends on executor_base & controller interfaces"
        permanent: false
        disable_when_in_development: true
        interface_monitor: true

      - name: _for_bleed/add-update-executor-action
        enabled: true
        description: "UpdateExecutorAction framework + controller volatility dispatch for progressive executor"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/test-fixes
        enabled: true
        description: "Test fixes: okx timeout, xrpl traceback/timing (Py3.12), market_data_provider mock spec"
        permanent: true
        disable_when_in_development: false

      - name: _for_bleed/pixi-workspace
        enabled: true
        description: "Pixi workspace migration and configuration"
        permanent: false
        disable_when_in_development: true

      # _for_bleed/market-simulator: REMOVED (2026-04-05)
      # Replaced by hb-market-simulator submodule via _for_bleed/pixi-workspace

      - name: _for_bleed/augmented-pure-python
        enabled: true
        description: "Cython-to-Augmented-Pure-Python framework: skill, docs, .gitignore for skills"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/add-executor-factory
        enabled: true
        description: "ExecutorFactory with decorator-based registration for all 8 executors"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/executor-mixins
        enabled: true
        description: "7 shared executor mixins: Retry, BalanceValidation, Shutdown, OrderTracking, ActivationBounds, TrailingStop, PNLCalculator"
        permanent: false
        disable_when_in_development: true

      # _for_bleed/cython-framework-subpackage: REMOVED (2026-04-05)
      # Replaced by hb-cython-framework submodule via _for_bleed/pixi-workspace

      - name: _for_bleed/patch-passwd-haskey-tests
        enabled: true
        description: "Remove failing password hash tests"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed/convert-to-pytest
        enabled: true
        description: "pytest migration: asyncio_mode=auto + pixi tasks for AST-based unittest→pytest via refactor package"
        permanent: false
        disable_when_in_development: true

      - name: _for_bleed_manual/kraken-tweaks
        enabled: true
        description: "Kraken order status handling and startup cleanup"
        permanent: false
        disable_when_in_development: false
