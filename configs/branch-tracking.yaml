  modular:
    # Passthrough layer between ci-base and bleeding-edge.
    # During each rebuild the script fast-forwards modular to the ci-base tip, then pushes.
    # Any merge conflict during fast-forward is treated as a hard abort (should never occur
    # because modular tracks ci-base exactly).
    # tracked_branches here carry sub-package wiring that must land on modular BEFORE
    # bleeding-edge features are merged.
    base_branch: ci-base

    tracked_branches:
      - name: _for_bleed/modular-wiring
        enabled: true
        base: modular
        tier: infrastructure
        merge_order: 1
        description: "Sub-package wiring layer: .gitmodules + 14 gitlinks, install-subpackages + compat tasks, ci/check_subpackage_compat.py, web_assistant/async_utils shims, sub-packages-compat CI job, remote_iface Phase-6 cutover (ce0721754)"
        permanent: false
        disable_when_in_development: false

